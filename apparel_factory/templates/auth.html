{% extends 'layout.html' %}
{% block main %}
  <div class="row justify-content-center mt-4">
    <div class="col-md-5">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <h4 class="fw-bold text-center mb-3">Авторизация на фабрике</h4>
          <p class="text-muted small text-center mb-4">
            Выберите роль, чтобы протестировать работу разных контекстов микросервисной архитектуры
          </p>
          <form action="/auth/sign-in" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Ваше Имя или Название компании:</label>
              <input type="text" name="full_name" class="form-control" placeholder="Например, Смирнова Е.В. или Бутик Мода" required />
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Роль в системе:</label>
              <select name="role" class="form-select">
                <option value="Технолог фабрики">Технолог фабрики (Выпуск коллекций и отгрузка)</option>
                <option value="Заказчик / Байер">Заказчик / Байер (Заказ пошива и покупка партий)</option>
              </select>
            </div>
            <button type="submit" class="btn btn-terracotta w-100 fw-semibold py-2">Продолжить</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
