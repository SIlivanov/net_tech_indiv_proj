<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>KAMA APPAREL — Производство одежды</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background-color: #f6f4f0; font-family: 'Segoe UI', sans-serif; }
      .brand-header { background: linear-gradient(90deg, #2b2623 0%, #4a3f39 100%); }
      .card-garment { border: none; border-top: 4px solid #6c584c; transition: transform 0.15s; }
      .card-garment:hover { transform: translateY(-3px); }
      .badge-season { background-color: #dde5b6; color: #2b2623; font-weight: 600; }
      .btn-terracotta { background-color: #a98467; color: white; }
      .btn-terracotta:hover { background-color: #8c6b50; color: white; }
    </style>
  </head>
  <body>
    <header class="navbar navbar-dark brand-header py-3 mb-4 shadow-sm">
      <div class="container">
        <div>
          <a class="navbar-brand fw-bold fs-4 text-uppercase" href="/">KAMA APPAREL</a>
          <span class="text-white-50 small d-none d-md-inline">| Швейная фабрика & B2B/B2C Шоурум</span>
        </div>
        <div class="d-flex align-items-center">
          {% if account %}
            <div class="text-end me-3 text-white">
              <div class="fw-semibold">{{ account.full_name }}</div>
              <span class="badge bg-warning text-dark">{{ account.role }}</span>
              <span class="small text-white-50 ms-1">Размер: {{ account.default_size }}</span>
            </div>
            <a href="/web/users/sign-out" class="btn btn-outline-light btn-sm">Сменить аккаунт</a>
          {% else %}
            <a href="/auth" class="btn btn-warning btn-sm fw-semibold">Личный кабинет</a>
          {% endif %}
        </div>
      </div>
    </header>

    <main class="container pb-5">
      {% block main %}{% endblock %}
    </main>
  </body>
</html>
